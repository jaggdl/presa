github_prod:
  user: one
  type: Services::Github
  name: Prod
  config: <%= { api_token: "ghp_secret_token" }.to_json %>

github_staging:
  user: one
  type: Services::Github
  name: Staging
  config: <%= { api_token: "ghp_staging_token" }.to_json %>

other_user_service:
  user: two
  type: Services::Github
  name: Prod
  config: <%= { api_token: "ghp_other_token" }.to_json %>

search_mcp:
  user: one
  type: Services::Mcp
  name: Search
  config: <%= { url: "https://search.parallel.ai/mcp", headers: "{}" }.to_json %>
jellyfin:
  user: one
  type: Services::Jellyfin
  name: Jellyfin
  config: <%= { api_key: "jellyfin_key", base_url: "https://jellyfin.example.com" }.to_json %>
seerr:
  user: one
  type: Services::Seerr
  name: Seerr
  config: <%= { api_key: "seerr_key", base_url: "http://localhost:5055" }.to_json %>
gmail:
  user: one
  type: Services::Gmail
  name: Gmail
  config: {}

google_analytics:
  user: one
  type: Services::GoogleAnalytics
  name: Google Analytics
  config: {}

strava:
  user: one
  type: Services::Strava
  name: Strava
  config: {}

spotify:
  user: one
  type: Services::Spotify
  name: Spotify
  config: {}

spotify_player:
  user: one
  type: Services::SpotifyPlayer
  name: Spotify Player
  config: {}

places:
  user: one
  type: Services::Places
  name: Google Places
  config: <%= { api_key: "places_test_key" }.to_json %>

workspace_manager:
  user: one
  type: Services::Workspace
  name: Workspace Admin
  config: <%= { workspace_ids: [ 1 ] }.to_json %>
