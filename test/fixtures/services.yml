github_prod:
  user: one
  type: Services::Github
  name: Prod
  config: <%= { api_token: "ghp_secret_token", base_url: "https://api.github.com" }.to_json %>

github_staging:
  user: one
  type: Services::Github
  name: Staging
  config: <%= { api_token: "ghp_staging_token", base_url: "https://api.github.com" }.to_json %>

other_user_service:
  user: two
  type: Services::Github
  name: Prod
  config: <%= { api_token: "ghp_other_token" }.to_json %>

search_mcp:
  user: one
  type: Services::Mcp
  name: Search
  config: <%= { url: "https://search.parallel.ai/mcp", headers: "{}" }.to_json %>
jellyfin:
  user: one
  type: Services::Jellyfin
  name: Jellyfin
  config: <%= { api_key: "jellyfin_key", base_url: "https://jellyfin.example.com" }.to_json %>
