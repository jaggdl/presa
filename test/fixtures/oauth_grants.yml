gmail_grant:
  service: gmail
  oauth_client_credential: google_credential
  provider: google
  access_token: fresh_access
  refresh_token: refresh_1
  token_type: Bearer
  scope: https://www.googleapis.com/auth/gmail.readonly
  expires_at: <%= 2.hours.from_now %>

google_analytics_grant:
  service: google_analytics
  oauth_client_credential: google_credential
  provider: google
  access_token: fresh_access
  refresh_token: refresh_1
  token_type: Bearer
  scope: https://www.googleapis.com/auth/analytics.readonly
  expires_at: <%= 2.hours.from_now %>

google_calendar_grant:
  service: google_calendar
  oauth_client_credential: google_credential
  provider: google
  access_token: fresh_access
  refresh_token: refresh_1
  token_type: Bearer
  scope: https://www.googleapis.com/auth/calendar
  expires_at: <%= 2.hours.from_now %>

# Notion tokens never expire and are not refreshable: no expires_at or
# refresh_token is stored.
notion_grant:
  service: notion
  oauth_client_credential: notion_credential
  provider: notion
  access_token: notion_access
  token_type: Bearer