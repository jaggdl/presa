name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  checks:
    runs-on: [self-hosted, presa]
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Show Ruby version
        run: ruby -v

      - name: Install gems
        run: bundle install

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit check --update

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Run tests
        env:
          RAILS_ENV: test
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails db:test:prepare test

  deploy:
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, presa]
    concurrency:
      group: deploy-master
      cancel-in-progress: false
    env:
      PRESA_SOURCE: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build production image
        run: docker compose -f /home/ja/services/presa/docker-compose.yml build

      - name: Restart service
        run: docker compose -f /home/ja/services/presa/docker-compose.yml up -d

      - name: Show service status
        run: docker compose -f /home/ja/services/presa/docker-compose.yml ps
