# Nextcloud — OpenAPI kind preset.
#
# Fields map onto what an `OpenapiKind` record needs: everything below is either
# read directly (title, namespace, base_url, spec_url, health_op, description)
# or used to configure the kind's virtual class (category, tags). The
# `definition` payload itself is generated by `Openapi::Generator` from
# `spec_url`, so it is intentionally not stored here.

title: Nextcloud

# Machine kind (namespace). Must be unique per team and match /[a-z0-9_]/.
namespace: nextcloud

# `Service` domain category shown on the picker card.
category: productivity

# Search/grouping tags shown as pills on the picker card.
tags:
  - self_hosted
  - cloud
  - storage
  - files

# URL of the OpenAPI 3.x document used to generate the kind's definition.
spec_url: https://raw.githubusercontent.com/nextcloud/server/refs/heads/master/openapi.json

# Default base URL (self-hosted — user overrides per service).
base_url: http://localhost:8080

# Operation used for "Test connection". GET /status.php — unauthenticated.
health_op: core-get-status

# User-facing Markdown description shown on the picker card / service header.
# Same shape as docs/services/*.md; a leading top-level heading is dropped when
# rendered, matching how `Service.description` treats its docs files.
description: |
  # Nextcloud

  Manage a [Nextcloud](https://nextcloud.com) server — self-hosted cloud storage and collaboration: browse and share files, administer users and groups through the provisioning API, and manage shares and app configuration.

  ## Configuration

  | Field | Required | Secret | Default | Description |
  |-------|----------|--------|---------|-------------|
  | `credential` | Yes* | Yes | — | The sign-in credential for authenticated operations. HTTP Basic requires `username:password`; Bearer accepts an app password or access token (prefer an app password when 2FA is enabled). |
  | `base_url` | No | No | `http://localhost:8080` | The server's base URL as reachable from this app, e.g. `https://cloud.example.com` or `http://<host>:8080`. Do **not** append `/ocs/v2.php` or `/remote.php`. |

  \* Required to run authenticated operations. The health check (`GET /status.php`) works without credentials.

  ## Notes

  - The OCS v2 API typically requires an `OCS-APIRequest: true` header, handled automatically by the generated tools.
  - Health check: `GET /status.php` (unauthenticated).
