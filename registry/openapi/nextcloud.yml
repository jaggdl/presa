description: |
  # Nextcloud

  Manage a [Nextcloud](https://nextcloud.com) server — self-hosted cloud storage and collaboration: browse and share files, administer users and groups through the provisioning API, and manage shares and app configuration.

  ## Configuration

  | Field | Required | Secret | Default | Description |
  |-------|----------|--------|---------|-------------|
  | `credential` | Yes* | Yes | — | The sign-in credential for authenticated operations. HTTP Basic requires `username:password`; Bearer accepts an app password or access token (prefer an app password when 2FA is enabled). |
  | `base_url` | No | No | `http://localhost:8080` | The server's base URL as reachable from this app, e.g. `https://cloud.example.com` or `http://<host>:8080`. Do **not** append `/ocs/v2.php` or `/remote.php`. |

  \* Required for every operation, including the health check.

  ## Notes

  - The OCS v2 API typically requires an `OCS-APIRequest: true` header, handled automatically by the generated tools.
  - Health check: `GET /ocs/v2.php/cloud/capabilities` (requires credentials).
