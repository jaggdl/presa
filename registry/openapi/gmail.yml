title: Gmail
namespace: gmail
category: productivity
spec_url: https://api.apis.guru/v2/specs/googleapis.com/gmail/v1/openapi.json
base_url: https://gmail.googleapis.com
oauth_provider: google
health_op: gmail.users.getProfile
description: |
  # Gmail

  Gmail REST API — read, send, and manage email for the authenticated user: draft and send messages (`gmail.users.messages.send`), search and retrieve mail and threads (`gmail.users.messages.list`/`get`, `gmail.users.threads.list`), manage labels (`gmail.users.labels.*`), and watch the mailbox for changes (`gmail.users.watch`). See the [official documentation](https://developers.google.com/gmail/api).

  ## Configuration

  | Field | Required | Secret | Default | Description |
  |-------|----------|--------|---------|-------------|
  | `credential` | Yes | Yes | — | Google OAuth 2.0 credential. Register a Google Cloud OAuth client (callback URL `oauth_callback_url`) and connect via the OAuth flow, authorizing the `https://www.googleapis.com/auth/gmail.readonly` scope (or a broader scope like `gmail.modify` / `gmail.send` to write). |
  | `base_url` | No | No | `https://gmail.googleapis.com` | The Gmail REST API base URL; Google-hosted, no self-hosted equivalent. |

  The health check (`GET /gmail/v1/users/me/profile`) validates the credential by fetching the profile of the authenticated user.