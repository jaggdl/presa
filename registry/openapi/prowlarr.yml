  # Prowlarr

  Self-hosted indexer manager and proxy for the *arr apps — aggregate and configure your torrent and usenet indexers in one place, then expose them to [Sonarr, Radarr, and the rest](https://github.com/Prowlarr/Prowlarr) through its HTTP API.