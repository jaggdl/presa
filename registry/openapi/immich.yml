# Immich — OpenAPI kind preset.
#
# Fields map onto what an `OpenapiKind` record needs: everything below is either
# read directly (title, namespace, base_url, spec_url, health_op, description)
# or used to configure the kind's virtual class (category, tags). The
# `definition` payload itself is generated by `Openapi::Generator` from
# `spec_url`, so it is intentionally not stored here.

title: Immich

# Machine kind (namespace). Must be unique per team and match /[a-z0-9_]/.
namespace: immich

# `Service` domain category shown on the picker card.
category: media

# Search/grouping tags shown as pills on the picker card.
tags:
  - self_hosted
  - photos
  - gallery
  - media

# URL of the OpenAPI 3.x document used to generate the kind's definition.
spec_url: https://raw.githubusercontent.com/immich-app/immich/refs/heads/main/open-api/immich-openapi-specs.json

# Default base URL (self-hosted — user overrides per service).
base_url: http://localhost:2283/api

# Operation used for "Test connection". GET /server/ping — unauthenticated.
health_op: pingServer

# User-facing Markdown description shown on the picker card / service header.
# Same shape as docs/services/*.md; a leading top-level heading is dropped when
# rendered, matching how `Service.description` treats its docs files.
description: |
  # Immich

  Self-hosted photo and video backup, at scale — browse galleries, upload and organize media, and manage the [Immich](https://immich.app) server through its API.

  ## Configuration

  | Field | Required | Secret | Default | Description |
  |-------|----------|--------|---------|-------------|
  | `credential` | Yes* | Yes | — | The API key for authenticated operations (issued from the Immich web UI under **Account → API Keys**). |
  | `base_url` | No | No | `http://localhost:2283/api` | The server's API base URL as reachable from this app, e.g. `https://photos.example.com/api` or `http://<host>:2283/api`. |

  \* Required to run authenticated operations. The health check (`GET /server/ping`) works without credentials.

  ## Notes

  - Health check: `GET /server/ping` (unauthenticated).
  - Most operations require an API key sent as a bearer token.
