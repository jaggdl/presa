title: Sonarr
namespace: sonarr
category: media
spec_url: https://raw.githubusercontent.com/Sonarr/Sonarr/develop/src/Sonarr.Api.V3/openapi.json
base_url: http://localhost:8989
health_op: get_system_status
description: |
  # Sonarr

  Self-hosted TV series collection manager — search, add, and organize your TV library, and manage the [Sonarr](https://sonarr.tv) server through its API.

  ## Configuration

  | Field | Required | Secret | Default | Description |
  |-------|----------|--------|---------|-------------|
  | `credential` | Yes* | Yes | — | The API key for authenticated operations (issued from the Sonarr web UI under **Settings → General**). |
  | `base_url` | No | No | `http://localhost:8989` | The server's base URL as reachable from this app, e.g. `http://<host>:8989`. |

  \* Required for every operation, including the health check. The health check (`GET /api/v3/system/status`) validates the API key.
